plugins {
    id 'fabric-loom' version '0.12.56'
    id 'maven-publish'
}

group = project.findProperty('maven_group') ?: 'com.mtrnav'
version = project.findProperty('mod_version') ?: '1.0.0'

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://api.modrinth.com/maven' }
    mavenCentral()
}

dependencies {
    minecraft 'com.mojang:minecraft:1.18.2'
    mappings 'net.fabricmc:yarn:1.18.2+build.4:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.14.25'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.77.0+1.18.2'

    def mtrJar = file('libs/MTR-fabric-4_0_5_1_18_2.jar')
    if (mtrJar.exists()) {
        modImplementation files(mtrJar)
    } else {
        modImplementation 'maven.modrinth:mtr:4.0.5+1.18.2'
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}
