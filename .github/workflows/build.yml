name: Build MTRNav

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip -d "$HOME"
          echo "$HOME/gradle-8.5/bin" >> "$GITHUB_PATH"

      - name: Check Gradle
        run: gradle --version

      - name: Build MTRNav
        run: gradle build --stacktrace --info

      - name: Check for built JAR
        run: |
          echo "=== build/libs ==="
          ls -lah build/libs
          echo "=== JAR files ==="
          find build/libs -maxdepth 1 -type f -name '*.jar' -print
          test -n "$(find build/libs -maxdepth 1 -type f -name '*.jar' -print -quit)"

      - name: Upload MTRNav JAR
        uses: actions/upload-artifact@v4
        with:
          name: mtrnav-jar
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
