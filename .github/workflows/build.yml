name: Build MTRNav

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build with Gradle
        run: gradle build

      - name: Upload MTRNav JAR
        uses: actions/upload-artifact@v4
        with:
          name: mtrnav-jar
          path: build/libs/*.jar
