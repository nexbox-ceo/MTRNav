name: Build MTRNav

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build MTRNav with Gradle Wrapper
        working-directory: MTRNav 4
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace --info

      - name: Check for built JAR
        working-directory: MTRNav 4
        run: |
          echo "=== build/libs ==="
          ls -lah build/libs
          echo "=== JAR files ==="
          find build/libs -maxdepth 1 -type f -name '*.jar' -print
          test -n "$(find build/libs -maxdepth 1 -type f -name '*.jar' -print -quit)"

      - name: Upload MTRNav JAR
        uses: actions/upload-artifact@v4
        with:
          name: mtrnav-jar
          path: MTRNav 4/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
