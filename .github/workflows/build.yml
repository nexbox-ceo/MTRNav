name: Build MTRNav

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip -d "$HOME"
          echo "$HOME/gradle-8.5/bin" >> "$GITHUB_PATH"

      - name: Check Gradle
        run: gradle --version

      - name: Build MTRNav
        run: gradle build --stacktrace --info

      - name: List build output
        if: always()
        run: |
          echo "=== build directory ==="
          find build -maxdepth 3 -type f -print 2>/dev/null || true

      - name: Upload MTRNav JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mtrnav-jar
          path: build/libs/*.jar
